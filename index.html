<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reçelim — Çok Yakında</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#210A10;
    --bg-mid:#43121B;
    --jam-red:#7C1B28;
    --jam-glow:#C9425A;
    --gold:#E8A33D;
    --gold-light:#F6CE85;
    --cream:#F7EAD0;
    --ink:#210A10;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg-deep);
    overflow:hidden;
  }

  body{
    font-family:'Manrope', sans-serif;
    color:var(--cream);
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- background ---------- */
  .bg{
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 50% 18%, var(--bg-mid) 0%, transparent 55%),
      radial-gradient(circle at 15% 85%, rgba(201,66,90,0.25) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(232,163,61,0.12) 0%, transparent 45%),
      linear-gradient(180deg, var(--bg-deep) 0%, #1a070c 100%);
    z-index:0;
  }

  .grain{
    position:fixed;
    inset:0;
    opacity:0.05;
    mix-blend-mode:overlay;
    pointer-events:none;
    z-index:1;
  }

  .bubbles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .bubble{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(246,206,133,0.55), rgba(201,66,90,0.15) 60%, transparent 75%);
    filter:blur(0.5px);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) scale(0.8); opacity:0; }
    10%{ opacity:0.8; }
    90%{ opacity:0.5; }
    100%{ transform:translateY(-110vh) scale(1.1); opacity:0; }
  }

  /* ---------- layout ---------- */
  .stage{
    position:relative;
    z-index:2;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(6px, 1.2vh, 14px);
    padding:2vh 4vw;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 16px;
    border-radius:999px;
    background:rgba(247,234,208,0.08);
    border:1px solid rgba(247,234,208,0.25);
    font-size:clamp(10px,1.1vh,12px);
    letter-spacing:0.18em;
    font-weight:600;
    text-transform:uppercase;
    color:var(--gold-light);
    opacity:0;
    animation:riseIn 0.7s ease-out 0.15s forwards;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 rgba(232,163,61,0.6);
    animation:pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,163,61,0.55); }
    50%{ box-shadow:0 0 0 6px rgba(232,163,61,0); }
  }

  /* ---------- jar composition ---------- */
  .jar-scene{
    position:relative;
    width:clamp(150px, 20vh, 220px);
    height:clamp(160px, 24vh, 240px);
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transform:translateY(26px) scale(0.9);
    animation:jarIn 0.9s cubic-bezier(.2,.9,.25,1.2) 0.35s forwards;
  }
  @keyframes jarIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .steam{ position:absolute; top:-26px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:5; }
  .steam span{
    width:3px; height:22px; border-radius:3px;
    background:linear-gradient(180deg, rgba(247,234,208,0), rgba(247,234,208,0.55), rgba(247,234,208,0));
    animation:steamUp 2.6s ease-in-out infinite;
    opacity:0;
  }
  .steam span:nth-child(1){ animation-delay:0.2s; }
  .steam span:nth-child(2){ animation-delay:0.9s; }
  .steam span:nth-child(3){ animation-delay:1.6s; }
  @keyframes steamUp{
    0%{ transform:translateY(6px) scaleY(0.6) rotate(-3deg); opacity:0; }
    30%{ opacity:0.7; }
    100%{ transform:translateY(-24px) scaleY(1.3) rotate(4deg); opacity:0; }
  }

  .lid{
    width:34%;
    aspect-ratio:5/2;
    background:linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 55%, #B97723 100%);
    border-radius:10px 10px 4px 4px;
    position:relative;
    z-index:4;
    box-shadow:0 3px 6px rgba(0,0,0,0.35), inset 0 2px 2px rgba(255,255,255,0.5);
    animation:lidPop 0.9s ease-out 1.1s;
  }
  .lid::after{
    content:"";
    position:absolute; inset:4px 6px auto 6px; height:3px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0 4px, transparent 4px 8px);
    opacity:0.6;
  }
  @keyframes lidPop{
    0%{ transform:translateY(0); }
    30%{ transform:translateY(-6px); }
    55%{ transform:translateY(1px); }
    100%{ transform:translateY(0); }
  }

  .neck{
    width:29%;
    height:6%;
    margin-top:-2%;
    background:linear-gradient(90deg, rgba(247,234,208,0.35), rgba(247,234,208,0.12));
    border-left:1px solid rgba(247,234,208,0.4);
    border-right:1px solid rgba(247,234,208,0.4);
    z-index:3;
  }

  .jar-body{
    width:82%;
    flex:1;
    margin-top:-1px;
    border-radius:22px 22px 46px 46px / 22px 22px 60px 60px;
    background:linear-gradient(160deg, rgba(247,234,208,0.14), rgba(247,234,208,0.05));
    border:1.5px solid rgba(247,234,208,0.4);
    box-shadow:
      inset -10px -14px 26px rgba(0,0,0,0.35),
      inset 8px 10px 18px rgba(255,255,255,0.08),
      0 14px 34px rgba(20,4,7,0.55);
    position:relative;
    overflow:hidden;
    z-index:2;
  }

  .jam-liquid{
    position:absolute;
    left:50%;
    bottom:0;
    width:230%;
    height:78%;
    background:radial-gradient(circle at 35% 20%, var(--jam-glow), var(--jam-red) 60%);
    border-radius:44%;
    transform:translate(-50%, 6%) rotate(0deg);
    animation:wave 7s linear infinite;
  }
  .jam-liquid.two{
    height:74%;
    opacity:0.55;
    animation-duration:9s;
    animation-direction:reverse;
    background:radial-gradient(circle at 60% 25%, var(--jam-red), #5B131D 65%);
  }
  @keyframes wave{
    from{ transform:translate(-50%, 6%) rotate(0deg); }
    to{ transform:translate(-50%, 6%) rotate(360deg); }
  }

  .jar-shine{
    position:absolute;
    top:6%;
    left:14%;
    width:16%;
    height:70%;
    background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
    border-radius:50%;
    filter:blur(1px);
    transform:rotate(8deg);
    z-index:3;
    pointer-events:none;
  }

  .drip{
    position:absolute;
    right:8%;
    bottom:-6px;
    width:9px; height:9px;
    background:var(--jam-glow);
    border-radius:50% 50% 50% 0;
    transform:rotate(45deg);
    animation:dripFall 3.4s ease-in 0.6s infinite;
    z-index:5;
  }
  @keyframes dripFall{
    0%{ transform:translateY(0) rotate(45deg); opacity:0; }
    8%{ opacity:1; }
    55%{ transform:translateY(46px) rotate(45deg); opacity:1; }
    62%{ opacity:0; }
    100%{ opacity:0; }
  }

  .puddle{
    position:absolute;
    bottom:-14px;
    right:2%;
    width:26px; height:8px;
    border-radius:50%;
    background:radial-gradient(circle, var(--jam-glow), transparent 70%);
    opacity:0.7;
  }
  .puddle::after{
    content:"";
    position:absolute; inset:-4px;
    border-radius:50%;
    border:1px solid rgba(201,66,90,0.5);
    animation:ripple 3.4s ease-out 0.9s infinite;
  }
  @keyframes ripple{
    0%{ transform:scale(0.4); opacity:0; }
    10%{ opacity:0.7; }
    60%{ transform:scale(2.2); opacity:0; }
    100%{ opacity:0; }
  }

  /* ---------- floating fruit ---------- */
  .fruit{
    position:absolute;
    z-index:3;
    opacity:0;
    animation:fruitIn 0.6s ease-out forwards, floaty 5s ease-in-out infinite;
  }
  .fruit svg{ width:100%; height:100%; display:block; }
  @keyframes fruitIn{ to{ opacity:1; } }
  @keyframes floaty{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-10px) rotate(6deg); }
  }
  .f1{ width:34px; height:34px; top:2%; left:-14%; animation-delay:1.2s, 0s; animation-duration:0.6s, 4.5s; }
  .f2{ width:26px; height:26px; top:34%; right:-16%; animation-delay:1.4s, 0.6s; animation-duration:0.6s, 5.4s; }
  .f3{ width:22px; height:22px; bottom:8%; left:-18%; animation-delay:1.6s, 1.2s; animation-duration:0.6s, 4.8s; }

  /* ---------- badge / wax seal ---------- */
  .seal{
    position:absolute;
    top:-6%;
    right:-22%;
    width:78px; height:78px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--jam-glow), var(--jam-red) 70%);
    border:2px dashed rgba(247,234,208,0.55);
    display:flex; align-items:center; justify-content:center;
    color:var(--cream);
    text-align:center;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:9.5px;
    letter-spacing:0.05em;
    line-height:1.25;
    transform:rotate(-14deg) scale(0);
    box-shadow:0 6px 18px rgba(0,0,0,0.4), 0 0 0 rgba(232,163,61,0.5);
    z-index:6;
    animation:sealIn 0.7s cubic-bezier(.3,1.4,.4,1) 1.5s forwards, sealPulse 2.6s ease-in-out 2.3s infinite;
  }
  @keyframes sealIn{ to{ transform:rotate(-14deg) scale(1); } }
  @keyframes sealPulse{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,0.4), 0 0 0 0 rgba(232,163,61,0.35); }
    50%{ box-shadow:0 6px 18px rgba(0,0,0,0.4), 0 0 0 8px rgba(232,163,61,0); }
  }

  /* ---------- typography ---------- */
  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(2.6rem, 8vh, 5.2rem);
    letter-spacing:-0.01em;
    line-height:1;
    margin:0;
    background:linear-gradient(100deg, var(--gold-light) 0%, var(--jam-glow) 35%, var(--gold-light) 55%, var(--gold) 80%);
    background-size:220% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 6px 18px rgba(20,4,7,0.5);
    opacity:0;
    animation:riseIn 0.8s ease-out 1.05s forwards, shine 5s linear 2s infinite;
  }
  @keyframes shine{
    0%{ background-position:0% 0%; }
    100%{ background-position:220% 0%; }
  }

  .tagline{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(1.1rem, 2.6vh, 1.6rem);
    color:var(--gold-light);
    transform:rotate(-2deg);
    margin:0;
    opacity:0;
    animation:riseIn 0.7s ease-out 1.3s forwards;
  }

  .desc{
    max-width:min(90vw, 480px);
    font-size:clamp(12.5px, 1.7vh, 15px);
    line-height:1.55;
    color:rgba(247,234,208,0.75);
    margin:0;
    opacity:0;
    animation:riseIn 0.7s ease-out 1.5s forwards;
  }

  .form{
    display:flex;
    gap:8px;
    margin-top:2px;
    opacity:0;
    animation:riseIn 0.7s ease-out 1.7s forwards;
    flex-wrap:wrap;
    justify-content:center;
  }

  .form input{
    font-family:'Manrope', sans-serif;
    font-size:13.5px;
    padding:12px 18px;
    border-radius:999px;
    border:1px solid rgba(247,234,208,0.3);
    background:rgba(247,234,208,0.06);
    color:var(--cream);
    width:min(58vw, 260px);
    outline-offset:2px;
  }
  .form input::placeholder{ color:rgba(247,234,208,0.45); }
  .form input:focus-visible{ outline:2px solid var(--gold); border-color:var(--gold); }

  .form button{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:12px 22px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    color:var(--ink);
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    box-shadow:0 6px 16px rgba(232,163,61,0.35);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .form button:hover{ transform:translateY(-2px); box-shadow:0 10px 22px rgba(232,163,61,0.45); }
  .form button:focus-visible{ outline:3px solid var(--gold-light); outline-offset:2px; }
  .form button:active{ transform:translateY(0); }

  .finePrint{
    font-size:11.5px;
    color:rgba(247,234,208,0.55);
    opacity:0;
    animation:riseIn 0.7s ease-out 1.85s forwards;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  footer{
    position:fixed;
    bottom:14px;
    left:0; right:0;
    text-align:center;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(247,234,208,0.35);
    z-index:2;
  }

  @media (max-width:520px){
    .seal{ width:64px; height:64px; font-size:8.5px; top:-4%; right:-20%; }
    .fruit{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
    .jam-liquid, .jam-liquid.two, .steam span, .drip, .puddle::after, .wordmark, .bubble{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="bubbles" id="bubbles"></div>

  <div class="stage">

    <div class="eyebrow"><span class="dot"></span>ÇOK YAKINDA AÇILIYOR</div>

    <div class="jar-scene">
      <div class="seal">ÇOK<br>YAKINDA</div>

      <div class="fruit f1">
        <svg viewBox="0 0 40 40"><circle cx="14" cy="24" r="9" fill="#C9425A"/><circle cx="26" cy="24" r="9" fill="#A81F35"/><path d="M14 15 C14 8, 20 6, 24 4" stroke="#5B8A4A" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="fruit f2">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#E8A33D"/><circle cx="20" cy="20" r="18" fill="none" stroke="#F6CE85" stroke-width="1.5"/><g stroke="#F6CE85" stroke-width="1.3"><path d="M20 3 V37"/><path d="M4 20 H36"/><path d="M8 8 L32 32"/><path d="M32 8 L8 32"/></g></svg>
      </div>
      <div class="fruit f3">
        <svg viewBox="0 0 40 40"><path d="M20 4 C30 4 36 14 36 22 C36 32 29 38 20 38 C11 38 4 32 4 22 C4 14 10 4 20 4 Z" fill="#C9425A"/><circle cx="14" cy="16" r="1.4" fill="#F6CE85"/><circle cx="22" cy="14" r="1.4" fill="#F6CE85"/><circle cx="27" cy="22" r="1.4" fill="#F6CE85"/><circle cx="17" cy="24" r="1.4" fill="#F6CE85"/><circle cx="24" cy="28" r="1.4" fill="#F6CE85"/></svg>
      </div>

      <div class="steam"><span></span><span></span><span></span></div>
      <div class="lid"></div>
      <div class="neck"></div>
      <div class="jar-body">
        <div class="jam-liquid two"></div>
        <div class="jam-liquid"></div>
        <div class="jar-shine"></div>
      </div>
      <div class="drip"></div>
      <div class="puddle"></div>
    </div>

    <h1 class="wordmark">REÇELİM</h1>
    <p class="tagline">kavanozun içinde bir sürpriz saklanıyor…</p>
    <p class="desc">Meyvenin en olgun hâlini ustaca karıştırıp kavanoza hapsettik. Reçelim çok yakında sofralarınızda.</p>

    <form class="form" onsubmit="return false;">
      <label class="visually-hidden" for="email" style="position:absolute; left:-9999px;">E-posta adresin</label>
      <input id="email" type="email" placeholder="E-posta adresin" required>
      <button type="submit">İlk Bilen Ben Olayım</button>
    </form>
    <p class="finePrint">Açılışta ilk 500 kişiye %20 indirim 🍯</p>

  </div>

  <footer>Reçelim © 2026</footer>

<script>
  // ambient rising bubbles
  const container = document.getElementById('bubbles');
  const count = 16;
  for(let i=0;i<count;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 6 + Math.random()*16;
    b.style.width = size+'px';
    b.style.height = size+'px';
    b.style.left = Math.random()*100+'vw';
    b.style.animationDuration = (7 + Math.random()*8)+'s';
    b.style.animationDelay = (Math.random()*8)+'s';
    container.appendChild(b);
  }
</script>

</body>
</html>
